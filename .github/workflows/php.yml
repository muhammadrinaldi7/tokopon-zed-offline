name: Deploy api to VPS

on:
  push:
    branches:
      - mobileapp-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies (with dev)
        run: composer install --no-interaction --optimize-autoloader

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Generate APP_KEY
        run: php artisan key:generate

    #   - name: Run PHPUnit tests
    #     run: vendor/bin/phpunit

  deploy_vps:
    needs: test # Menunggu deploy staging web hosting selesai
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Mengambil kode terbaru dari GitHub
        uses: actions/checkout@v4

      # 2. Setup Node.js untuk build asset frontend (Vite)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Cache NPM dependencies
      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      # 4. Install Node dependencies & Build assets
      - name: Install Node dependencies & Build assets
        run: |
          npm install
          npm run build

      # 5. ZIP file ringan (Mengecualikan vendor, storage, node_modules, dan file non-produksi)
      # Ukuran zip berkurang dari 100MB+ menjadi ~3-5MB sehingga transfer SCP hanya butuh beberapa detik
      - name: Compress files
        run: |
          zip -q -r deploy.zip . -x \
            "node_modules/*" \
            "vendor/*" \
            "storage/*" \
            ".git/*" \
            "tests/*" \
            ".agents/*" \
            "artifacts/*" \
            "scratch/*" \
            "desain-figma/*"

      - name: 📂 Mentransfer file ke CloudPanel (via SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.API_USERNAME }}
          key: ${{ secrets.API_SSH_KEY }}
          port: ${{ secrets.API_PORT }}
          source: "deploy.zip"
          target: "/home/${{ secrets.API_USERNAME }}/htdocs/${{secrets.API_URL}}/"

      - name: ⚙️ Menjalankan perintah post-deploy di server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.API_USERNAME }}
          key: ${{ secrets.API_SSH_KEY }}
          port: ${{ secrets.API_PORT }}
          script: |
            # Pastikan direktori root tujuan tersedia
            mkdir -p /home/${{ secrets.API_USERNAME }}/htdocs/${{secrets.API_URL}}/
            
            # Pindah ke folder project
            cd /home/${{ secrets.API_USERNAME }}/htdocs/${{secrets.API_URL}}/
            unzip -q -o deploy.zip
            rm deploy.zip
            
            # Pastikan struktur folder storage dan permissions tersedia
            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache
            
            # Pasang / perbarui vendor production langsung di server CloudPanel
            composer install --no-dev --optimize-autoloader
            
            # Jalankan migrasi database otomatis (aman & idempotent)
            php artisan migrate --force
            
            # Hubungkan folder storage jika belum terhubung
            php artisan storage:link
            
            # Bersihkan cache lama & buat cache baru untuk production
            php artisan optimize:clear
            php artisan config:cache
            php artisan event:cache
            php artisan route:cache
            php artisan view:cache
